name: Daily forecast

# Advisory prices for the coming day are published the evening before, and
# CBS releases on Thursday mornings, so an early-morning run picks up both.
# 05:00 UTC is 06:00 CET / 07:00 CEST.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/**"
      - ".github/workflows/daily.yml"

permissions:
  contents: write   # advisory-price history, and the gh-pages branch

# Never let two runs race on the advisory-price file.
concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # There is no public archive of advisory prices, so the history is
      # only as long as the number of days this job has run. A failure here
      # must not fail the build -- the pipeline falls back to the CBS anchor
      # -- but it must be visible, because a silently broken scraper would
      # cost a day of history every day until someone noticed.
      - name: Record today's advisory price
        run: |
          if ! make snapshot; then
            echo "::warning title=Advisory price not recorded::Scraping \
          UnitedConsumers failed. The forecast falls back to the CBS anchor, \
          but today's advisory price is lost permanently. See src/benzine/sources/gla.py."
          fi

      # Deliberately --source live, not auto: if a feed is down we want a
      # red build, not a synthetic forecast quietly published as if real.
      - name: Build forecast
        run: PYTHONPATH=src python -m benzine forecast --source live

      - name: Commit advisory-price history
        run: |
          # The scrape is allowed to fail, so the file may not exist at all.
          if [ ! -f data/raw/gla_history.csv ]; then
            echo "no advisory-price history yet -- scrape likely failed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage first, then compare against the index: on the very first
          # run the file is untracked, and `git diff` alone does not see
          # untracked files -- so day one would never be recorded.
          git add data/raw/gla_history.csv
          if git diff --cached --quiet; then
            echo "no new advisory price to store"
            exit 0
          fi
          git commit -m "Record advisory price for $(date -u +%Y-%m-%d)"
          git push

      # Published by pushing to a branch rather than through the Pages
      # deployment API (configure-pages / upload-pages-artifact /
      # deploy-pages). That API repeatedly accepted a deployment and then
      # sat on "deployment_in_progress" indefinitely -- nothing on our side
      # to fix, and nothing on our side to work around either, as long as
      # we depended on it.
      #
      # A branch push goes through Pages' other, older serving path, so a
      # stall in the deployment API cannot block it. It is also simply less
      # machinery: no artifact, no environment, no deployment to poll.
      #
      # The branch is rebuilt from a single commit each time. It holds
      # generated output only, so its history is worth nothing and an
      # ever-growing branch of published sites costs clone time forever.
      - name: Publish site to gh-pages
        run: |
          site="$RUNNER_TEMP/site"
          rm -rf "$site"
          cp -r web "$site"
          # Without this, Pages runs the files through Jekyll, which skips
          # anything beginning with an underscore and adds a build step we
          # have no use for.
          touch "$site/.nojekyll"

          cd "$site"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publish forecast for $(date -u +%Y-%m-%d)"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
          echo "published $(ls | tr '\n' ' ')"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
