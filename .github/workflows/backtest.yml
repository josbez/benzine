name: Weekly backtest

# The walk-forward evaluation takes minutes and its scores barely move from
# one day to the next, so it runs on its own schedule and caches the result
# in data/backtest_metrics.json. The daily job just reads that file.
on:
  schedule:
    - cron: "0 4 * * 1"   # Mondays, ahead of the week's runs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # Shares the forecast job's download caches (same key prefix), which
      # run several times a day, so this job normally starts with a table
      # that is hours old. That is what turns an unreachable CBS from a
      # failed run into a slightly stale one -- which is what happened on
      # 7 August, on a runner that had reached the same host two hours
      # earlier.
      - name: Restore source caches
        uses: actions/cache/restore@v6
        with:
          path: data/raw/*.parquet
          key: source-caches-${{ github.run_id }}
          restore-keys: source-caches-

      - run: pip install -r requirements.txt

      - name: Run tests
        run: PYTHONPATH=src python -m pytest tests/ -q

      # Refit every 60 days rather than the CLI default of 30. The panel
      # spans roughly twenty years, so halving the number of refits halves
      # a run that was otherwise threatening the timeout below. With that
      # much training history the model barely moves between refits, so
      # the accuracy cost is small and the reliability gain is not.
      - name: Walk-forward backtest
        run: PYTHONPATH=src python -m benzine backtest --source live --refit-every 60

      # Monday 04:00 and the daily run's 05:00 are close enough together,
      # and this job long enough, that the two regularly try to push at the
      # same time. The helper rebases and retries rather than losing a run's
      # worth of work to "fetch first".
      - name: Commit refreshed scores
        run: |
          .github/scripts/commit-and-push.sh \
            data/backtest_metrics.json \
            "Refresh backtest scores"
