name: Daily forecast

# Three times a day, at 03:00, 12:00 and 17:00 Dutch time.
#
# Cron here is UTC and GitHub does not do daylight saving, so these are
# set for CEST (UTC+2). Through the winter they land an hour earlier in
# local terms -- 02:00, 11:00, 16:00 -- which changes nothing that
# matters: advisory prices for the coming day are published the evening
# before, and CBS releases on Thursday mornings, so the first run of the
# day picks up both either way.
#
# The later two runs exist for the wholesale side. RBOB and Brent trade
# through the afternoon, so the midday and late runs see the day's move
# rather than yesterday's close. That is also why the source caches
# expire in hours rather than half a day: with a 12-hour cache the extra
# runs would republish an identical forecast.
on:
  schedule:
    - cron: "0 1,10,15 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/**"
      - ".github/workflows/daily.yml"
      - ".github/scripts/**"

permissions:
  contents: write   # advisory-price history, and the gh-pages branch
  issues: write     # raising the alarm when the scraper breaks

# Never let two runs race on the advisory-price file.
concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Only the download caches, never data/raw/gla_history.csv: that file
      # is tracked in git, and restoring a stale copy over the checkout
      # would make the next commit silently revert a day of history.
      #
      # Restore and save are separate actions rather than one `actions/cache`
      # step because this job is expected to end red for as long as Pages is
      # stuck, and the combined action's post step does not save the cache
      # when the job fails -- which would mean re-downloading twenty years
      # of history every morning, forever.
      - name: Restore source caches
        uses: actions/cache/restore@v6
        with:
          path: data/raw/*.parquet
          key: source-caches-${{ github.run_id }}
          restore-keys: source-caches-

      - run: pip install -r requirements.txt

      # ----------------------------------------------------------------
      # Perishable data first. Everything below this block can fail
      # without costing anything that cannot be fetched again; the
      # advisory price cannot. There is no public archive of it, so a day
      # not recorded here is a day missing from the series forever -- and
      # that series is what will eventually let the site show a same-day
      # price instead of a CBS figure up to nine days old.
      #
      # This is why the commit runs *before* the build, and not, as it
      # used to, after it: on 6 August the build failed nine times in a
      # row and every one of those runs threw away a scraped price it was
      # already holding.
      # ----------------------------------------------------------------
      - name: Record today's advisory price
        id: snapshot
        run: |
          # Without pipefail the exit status through `tee` is tee's, and a
          # broken scraper would report success.
          set -o pipefail
          if make snapshot 2>&1 | tee "$RUNNER_TEMP/snapshot.log"; then
            exit 0
          fi
          echo "failed=true" >> "$GITHUB_OUTPUT"

      - name: Commit advisory-price history
        run: |
          .github/scripts/commit-and-push.sh \
            data/raw/gla_history.csv \
            "Record advisory price for $(date -u +%Y-%m-%d)"

      # A warning in a log nobody reads is indistinguishable from nothing
      # happening, and every unnoticed day is one more permanent hole in
      # the series. One open issue, updated in place, so a scraper that
      # breaks for a fortnight does not produce a fortnight of issues.
      - name: Report a broken scraper
        if: steps.snapshot.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The probe answers the question the snapshot log raises: if the
          # price is not in the page text, where is it? It runs here rather
          # than being left to a human because it needs to reach the live
          # page, which is exactly what a laptop debugging this often
          # cannot do. It must never turn a scraper failure into a job
          # failure, hence the `|| true`.
          make probe > "$RUNNER_TEMP/probe.log" 2>&1 || true

          {
            echo "The daily run could not read today's Euro 95 advisory price"
            echo "from UnitedConsumers. The forecast falls back to the CBS"
            echo "anchor, but today's advisory price is lost permanently."
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "<details><summary>Scrape error</summary>"
            echo
            echo '```'
            tail -c 4000 "$RUNNER_TEMP/snapshot.log"
            echo '```'
            echo
            echo "</details>"
            echo
            echo "### Where the price actually is"
            echo
            echo '```'
            tail -c 8000 "$RUNNER_TEMP/probe.log"
            echo '```'
          } > "$RUNNER_TEMP/issue.md"

          # Edit the existing issue rather than commenting on it. A scraper
          # that stays broken for a fortnight would otherwise leave a
          # fortnight of near-identical comments, which is how a signal
          # turns back into noise. The body always shows the latest run;
          # closing the issue after a fix means the next break opens a new
          # one, and that is what notifies.
          existing=$(gh issue list --label scraper --state open \
            --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh label create scraper --color d93f0b \
              --description "The advisory-price scraper needs attention" \
              2>/dev/null || true
            gh issue create --label scraper \
              --title "Advisory-price scraper is failing" \
              --body-file "$RUNNER_TEMP/issue.md"
          fi

      # ----------------------------------------------------------------
      # From here on, failing is allowed: nothing below is perishable.
      # ----------------------------------------------------------------
      - name: Run tests
        run: PYTHONPATH=src python -m pytest tests/ -q

      # Deliberately --source live, not auto: if a feed is down we want a
      # red build, not a synthetic forecast quietly published as if real.
      - name: Build forecast
        run: PYTHONPATH=src python -m benzine forecast --source live

      - name: Save source caches
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data/raw/*.parquet
          key: source-caches-${{ github.run_id }}

      # Published by pushing to a branch rather than through the Pages
      # deployment API (configure-pages / upload-pages-artifact /
      # deploy-pages). That API repeatedly accepted a deployment and then
      # sat on "deployment_in_progress" indefinitely.
      #
      # Note that this has not in fact fixed anything: GitHub's own "pages
      # build and deployment" workflow, which a push to this branch
      # triggers, runs deploy-pages internally and stalls in exactly the
      # same way (run 31110887125). The branch route is kept because it is
      # less machinery, not because it is a workaround -- the stall is a
      # Pages configuration problem and has to be fixed there.
      #
      # The branch is rebuilt from a single commit each time. It holds
      # generated output only, so its history is worth nothing and an
      # ever-growing branch of published sites costs clone time forever.
      - name: Publish site to gh-pages
        run: |
          site="$RUNNER_TEMP/site"
          rm -rf "$site"
          cp -r web "$site"
          # Without this, Pages runs the files through Jekyll, which skips
          # anything beginning with an underscore and adds a build step we
          # have no use for.
          touch "$site/.nojekyll"

          cd "$site"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publish forecast for $(date -u +%Y-%m-%d)"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
          echo "published $(ls | tr '\n' ' ')"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A green run that published nothing is worse than a red one: it is
      # the reason this went unnoticed for as long as it did. Until the
      # Pages deployment is unstuck this step will fail every day, which
      # is the correct reading of the situation -- and by now it fails
      # after the advisory price is safely committed.
      - name: Verify the site serves this run's forecast
        run: python .github/scripts/verify_published.py web/forecast.json 300
